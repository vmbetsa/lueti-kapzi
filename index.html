<style>
/* Layout: eine Handyspalte (max 480px), Kopfzeile oben, Tabs unten, Karten dazwischen */
:root{
  /* Design A Flutlicht: eine dunkle Welt, Gelb als Flutlicht Akzent */
  --bg:#0a1220; --surface:#111c2d; --surface2:#17243a; --ink:#eef3f8; --muted:#8fa3bb; --line:#1f2d42;
  --accent:#ffd54a; --accent-ink:#0a1220; --accent-soft:rgba(255,213,74,0.12);
  --good:#34d17e; --warn:#ffb84d; --warn-soft:rgba(255,184,77,0.12); --bad:#ff6b6b; --bad-soft:rgba(255,107,107,0.12);
  --t-rot:#ff5d5d; --t-gruen:#34d17e; --t-blau:#5b9bff;
  --font-display:"Sora",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-family:var(--font-display);font-size:24px;margin:0;letter-spacing:.3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.viewas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.viewas select{flex:1}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--font-display);font-size:20px;margin:0;text-wrap:balance}
.card h3{font-size:14px;margin:0;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.big{font-family:var(--font-display);font-size:34px;line-height:1}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.teams{background:var(--warn-soft);color:var(--warn)}
.pill.plan{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vote button{padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--font-body);cursor:pointer}
.vote button.sel-dabei{border-color:var(--good);background:var(--accent-soft);color:var(--good)}
.vote button.sel-nein{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.vote button.sel-unklar{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-family:var(--font-display);font-size:24px}
.stats span{font-size:12px;color:var(--muted)}
ol.list,ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.num{display:inline-block;min-width:24px;color:var(--muted);font-size:13px}
.sep{font-size:12px;font-weight:600;color:var(--warn);text-transform:uppercase;letter-spacing:.6px;padding-top:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
button.btn{font:600 15px var(--font-body);padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.small{padding:6px 10px;font-size:13px}
button.btn.danger{color:var(--bad)}
a.btn{display:inline-block;text-align:center;text-decoration:none;font:600 15px var(--font-body);padding:11px 14px;border-radius:10px;background:var(--accent);color:#fff}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > *{flex:1}
.alert{border-left:4px solid var(--warn);background:var(--warn-soft)}
.teams{display:grid;grid-template-columns:1fr;gap:12px}
.team{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.team .row b{font-family:var(--font-display);font-size:18px}
.pchip{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:15px;border:2px solid transparent;cursor:default}
.pchip.tap{cursor:pointer}
.pchip.sel{border-color:var(--accent)}
.score{font-family:var(--font-display);font-size:22px}
.game{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.game:last-child{border-bottom:0}
.game .r{text-align:right}
.delta{font-size:12px;color:var(--muted)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:500 15px var(--font-body);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form input,.form select{width:100%}
.viewas select{min-width:0}
.rule{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rule .full{grid-column:1/-1}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:8px;border-radius:8px;word-break:break-all}
.demo{border-style:dashed}
.ttag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.pairs{display:grid;gap:8px}
.pair{display:flex;justify-content:center;gap:8px;align-items:center;padding:14px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));border:2px solid var(--tc)}
.sname{font-weight:700;font-size:18px}
.sgoals{font-family:var(--font-display);font-size:64px;line-height:1}
.goal{background:var(--tc)!important;border-color:var(--tc)!important;color:#fff!important;font-size:18px!important;padding:14px!important}
.game{position:relative}
.gno{grid-column:1/-1;font-size:12px;color:var(--muted)}
.del{grid-column:1/-1;justify-self:end}
textarea{font:500 15px var(--font-body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;width:100%}
.prow{flex-direction:column;align-items:stretch !important;gap:6px}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rgrid label{font-size:11.5px}
.rgrid input{width:100%;padding:7px 6px}
.cats{font-size:12.5px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
nav .in{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;padding:12px 4px 16px;border:0;background:none;font:600 14px var(--font-body);color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav button.act{color:var(--accent);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:90%;display:none}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}
@media (prefers-reduced-motion: no-preference){ .card{transition:border-color .2s} }

/* ---------- Design A Overrides ---------- */
body{background:radial-gradient(900px 420px at 50% -180px,rgba(255,213,74,0.13),transparent 70%),var(--bg);background-repeat:no-repeat;background-color:var(--bg)}
header{background:rgba(10,18,32,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0}
.chip{background:rgba(255,255,255,0.05);border-color:var(--line);color:var(--muted)}
.card{background:linear-gradient(160deg,rgba(255,255,255,0.06),rgba(255,255,255,0.025));border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:18px}
.card h2{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-0.2px}
.card h3{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
.big{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-0.5px}
.pill{background:transparent!important;border:1px solid currentColor}
.pill.open{color:var(--accent)} .pill.teams{color:var(--warn)} .pill.plan{color:var(--muted)}
.vote{gap:4px;padding:4px;border-radius:16px;background:rgba(0,0,0,0.3)}
.vote button{border:0;background:transparent;color:#c9d5e3;border-radius:12px;padding:13px 4px}
.vote button.sel-dabei{background:var(--accent);color:var(--accent-ink)}
.vote button.sel-nein{background:var(--bad);color:#1a0b0b}
.vote button.sel-unklar{background:var(--warn);color:#1f1404}
button.btn{background:transparent;border:1px solid rgba(255,255,255,0.14);color:var(--ink);border-radius:12px}
button.btn.primary,a.btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.alert{border:1px solid rgba(255,213,74,0.35);background:linear-gradient(160deg,rgba(255,213,74,0.10),rgba(255,213,74,0.03))}
.code{background:rgba(0,0,0,0.3);color:#d8e2ee}
.list li{border-bottom-color:rgba(255,255,255,0.06)}
.pchip{background:rgba(255,255,255,0.05)}
.team{border-color:rgba(255,255,255,0.08);border-radius:16px;background:rgba(255,255,255,0.02)}
input,select,textarea{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.tbl th,.tbl td{border-bottom-color:rgba(255,255,255,0.06)}
.sgoals{font-weight:600;letter-spacing:-2px}
.side{background:color-mix(in srgb,var(--tc) 14%,transparent);border:1px solid color-mix(in srgb,var(--tc) 50%,transparent)}
.goal{background:color-mix(in srgb,var(--tc) 22%,transparent)!important;border:1px solid color-mix(in srgb,var(--tc) 60%,transparent)!important;color:var(--ink)!important}
.ring{display:flex;align-items:center;gap:16px}
.ring .rw{position:relative;width:84px;height:84px;flex-shrink:0}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc b{font-family:var(--font-display);font-size:22px;line-height:1}
.ring .rc span{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,0.06);color:#c9d5e3}
.toast{background:var(--accent);color:var(--accent-ink);font-weight:600}
/* Handy: schwebende Navigationsleiste */
nav{left:12px;right:12px;bottom:14px;border:1px solid rgba(255,255,255,0.09);border-radius:26px;background:rgba(23,36,58,0.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav .in{padding:5px;gap:4px}
nav button{border:0;border-radius:20px;padding:11px 2px;font-size:12.5px;color:#a9b8ca}
nav button.act{background:var(--accent);color:var(--accent-ink);border-top:0}
main{padding-bottom:110px}
/* Notebook: Seitenleiste links, Inhalt in Spalten */
@media (min-width: 960px){
  .app{max-width:1320px;display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:8px}
  header{grid-column:1;grid-row:1;position:static;background:transparent;border:0;padding:28px 18px 8px}
  nav{grid-column:1;grid-row:2;position:sticky;top:0;align-self:start;left:auto;right:auto;bottom:auto;margin:12px 14px;background:transparent;border:0;backdrop-filter:none}
  nav .in{flex-direction:column;padding:0;max-width:none}
  nav button{text-align:left;padding:12px 16px;font-size:15px;border-radius:14px}
  main{grid-column:2;grid-row:1 / span 2;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));align-items:start;align-content:start;gap:18px;padding:32px 32px 48px}
  main > .wide{grid-column:1 / -1}
  .teams{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .viewas{flex-direction:column;align-items:stretch}
  .viewas label{flex-direction:column!important;align-items:stretch!important}
  .brand{flex-direction:column;align-items:flex-start;gap:12px}
}
.row > .pill{flex:none;width:auto;display:inline-block}
</style>
</head>

<script>
"use strict";
const SB="https://ladedtlgqknszotcgvfq.supabase.co";
const KEY="sb_publishable_Fw2P9xngH8KdxYDIjCU9zQ_dVsVIt-o";
const BASE=location.origin+location.pathname;
const DAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const TEAMS=[["Rot","var(--t-rot)"],["Grün","var(--t-gruen)"],["Blau","var(--t-blau)"]];
const ERR={NICHT_ANGEMELDET:"Bitte über deinen persönlichen Zugangslink anmelden.",KEIN_ADMIN:"Nur für Admins.",ZU_WENIGE:"Weniger als 10 Zusagen: keine zwei Teams möglich.",
  ABSTIMMUNG_GESCHLOSSEN:"Die Abstimmung ist geschlossen, das Spiel hat begonnen.",KEINE_ABSTIMMUNG:"Gerade läuft keine Abstimmung.",LINK_UNGUELTIG:"Dieser Link ist ungültig oder abgelaufen. Bitte den Admin um einen neuen Link.",
  SPIELE_VORHANDEN:"Es sind schon Spiele eingetragen, die Teams lassen sich nicht mehr ändern.",GLEICHES_TEAM:"Die beiden Spieler sind im selben Team.",KEINE_TEAMS:"Es stehen noch keine Teams.",
  NAME_UNGUELTIG:"Bitte einen Namen mit 2 bis 40 Zeichen eingeben.",WARTET_AUF_FREIGABE:"Deine Registrierung wartet noch auf Freigabe.",ABSTIMMUNG_LAEUFT:"Es läuft bereits eine Abstimmung.",KEIN_SPIELTAG:"Bitte zuerst einen Spieltag anlegen."};

let token=null; try{token=localStorage.getItem("lk_token");}catch(e){}
let S=null, tab="start", live=null, selected=null, linkBox=null, regCode=null, confirmClose=false, loading=false;

// ---------- Hilfen ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,d=2)=>v==null?"":Number(v).toFixed(d).replace(".",",");
function parts(iso){const p={};new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",weekday:"short",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(iso)).forEach(x=>p[x.type]=x.value);return p;}
function dLong(iso){const d=new Date(iso);const wd=new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",weekday:"long"}).format(d);const p=parts(iso);return `${wd}, ${p.day}.${p.month}.`;}
function dShort(iso){const p=parts(iso);return `${p.weekday.replace(".","")}, ${p.day}.${p.month}.`;}
const tm=iso=>{const p=parts(iso);return `${p.hour}:${p.minute}`;};
const tname=i=>TEAMS[i-1]?TEAMS[i-1][0]:"Team "+i;
const tcol=i=>TEAMS[i-1]?TEAMS[i-1][1]:"var(--muted)";
const ttag=i=>`<span class="ttag"><span class="tdot" style="background:${tcol(i)}"></span>${tname(i)}</span>`;
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display="none",3000);}
function setToken(t){token=t;try{localStorage.setItem("lk_token",t);}catch(e){}}
function clearToken(){token=null;try{localStorage.removeItem("lk_token");}catch(e){}}
async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok){const m=(j&&j.message)||"FEHLER";const e=new Error(m);e.code=m;throw e;}
  return j;
}
async function act(fn,args,okMsg){
  try{const st=await rpc(fn,{p_token:token,...args});if(st&&st.me)S=st;if(okMsg)toast(okMsg);render();return st;}
  catch(e){handleErr(e);return null;}
}
function handleErr(e){
  if(e.code==="NICHT_ANGEMELDET"){clearToken();S=null;renderNoLogin();return;}
  toast(ERR[e.code]||"Das hat nicht geklappt. Bitte noch einmal versuchen.");
}
async function load(silent){
  if(loading)return;loading=true;
  try{S=await rpc("get_state",{p_token:token});render();}
  catch(e){if(!silent||e.code==="NICHT_ANGEMELDET")handleErr(e);}
  finally{loading=false;}
}
function copy(text){
  try{navigator.clipboard.writeText(text).then(()=>toast("Kopiert"),()=>fallbackCopy(text));}catch(e){fallbackCopy(text);}
}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Kopiert");}catch(e){toast("Bitte Text markieren und kopieren");}ta.remove();}

// ---------- Daten ableiten ----------
const P=id=>S.players.find(p=>p.id===id)||{name:"Unbekannt"};
const isAdmin=()=>S&&S.me.role==="admin";
const resp=()=>Object.fromEntries((S.responses||[]).map(r=>[r.player_id,r]));
function confirmed(){return (S.responses||[]).filter(r=>r.answer==="dabei"&&P(r.player_id).status==="aktiv").sort((a,b)=>new Date(a.confirmed_at)-new Date(b.confirmed_at)).map(r=>r.player_id);}
function teams(){const t={};(S.teams||[]).forEach(x=>{(t[x.team_no]=t[x.team_no]||[]).push(x.player_id);});return Object.keys(t).sort((a,b)=>a-b).map(k=>({no:+k,ids:t[k].sort((a,b)=>(P(b).rating||0)-(P(a).rating||0))}));}
function waitlist(){const c=confirmed();if((S.teams||[]).length){const inT=new Set(S.teams.map(x=>x.player_id));return c.filter(id=>!inT.has(id));}const k=Math.floor(c.length/5);return c.slice(k*5);}
const avg=(ids,f)=>ids.reduce((s,id)=>s+Number(P(id)[f]||0),0)/Math.max(ids.length,1);
function shareText(){
  const md=S.matchday;const t=(S.settings&&S.settings.template)||"";
  const split=md?`${DAYS[new Date(md.split_at).getDay()]}, ${tm(md.split_at)} Uhr`:"";
  return t.replaceAll("{datum}",md?dShort(md.game_at):"").replaceAll("{uhrzeit}",md?tm(md.game_at):"").replaceAll("{teamaufteilung}",split).replaceAll("{link}",BASE);
}
function standings(games,k){
  const t=Array.from({length:k},(_,i)=>({i:i+1,sp:0,s:0,u:0,n:0,tf:0,ta:0,pk:0}));
  games.forEach(([a,b,ga,gb])=>{[[a,ga,gb],[b,gb,ga]].forEach(([x,f,c])=>{const r=t[x-1];if(!r)return;r.sp++;r.tf+=f;r.ta+=c;if(f>c){r.s++;r.pk+=3;}else if(f===c){r.u++;r.pk++;}else r.n++;});});
  return t.sort((x,y)=>y.pk-x.pk||(y.tf-y.ta)-(x.tf-x.ta)||y.tf-x.tf);
}
const standingsHtml=(games,k)=>`<table class="tbl"><thead><tr><th>Team</th><th>Sp</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Pkt</th></tr></thead><tbody>${standings(games,k).map(r=>`<tr><td>${ttag(r.i)}</td><td>${r.sp}</td><td>${r.s}</td><td>${r.u}</td><td>${r.n}</td><td>${r.tf}:${r.ta}</td><td><b>${r.pk}</b></td></tr>`).join("")}</tbody></table>`;
function gamesHtml(games,del){

function render(){
  if(!S)return;
  $("#who").textContent=S.me.name+(isAdmin()?" · Admin":"");
  if(S.me.status==="wartet"){
    $("#nav").innerHTML="";
    $("#main").innerHTML=`<div class="card wide"><h2>Danke, ${esc(S.me.name)}</h2><p class="muted">Deine Registrierung ist eingegangen. Sobald ein Admin dich freigibt, kannst du abstimmen und die Teams sehen. Öffne die App dann einfach noch einmal.</p></div>`;
    return;
  }
  const tabs=[["start","Start"],["teams","Teams"],["abend","Spielabend"],["historie","Historie"]];

}

async function sendLink(pid,res){
  const p=P(pid),link=BASE+"?z="+res.link;
  const msg=`Hallo ${p.name}, hier ist dein persönlicher Zugang zur Lüti Kapzi App. Einfach antippen, danach bleibst du angemeldet: ${link}`;
  const digits=(p.phone||"").replace(/[^0-9]/g,"").replace(/^00/,"");
  const wa=`https://wa.me/${digits}?text=`+encodeURIComponent(msg);
  linkBox=`<div class="card alert"><b>Zugangslink für ${esc(p.name)}</b><div class="code">${esc(link)}</div><p class="muted">Ein früherer Link dieses Spielers ist damit ungültig. ${digits?"":"Ohne Handynummer wählst du den Chat in WhatsApp selbst."}</p><div class="btns"><a class="btn" href="${wa}" target="_blank" rel="noopener">Per WhatsApp senden</a><button class="btn" data-copy="${esc(msg)}">Nachricht kopieren</button></div></div>`;
  render();window.scrollTo({top:0,behavior:"smooth"});
}

// ---------- Ereignisse ----------
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-pick]");if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;selected=null;confirmClose=false;render();window.scrollTo(0,0);return;}
  if(d.vote){const st=await act("set_answer",{p_answer:d.vote});if(st)toast(d.vote==="dabei"?"Du bist dabei":d.vote==="nein"?"Abgesagt":"Gespeichert: noch unklar");return;}
  if(d.pick){const id=+d.pick;if(selected==null){selected=id;render();return;}if(selected===id){selected=null;render();return;}const a=selected;selected=null;await act("admin_swap",{p1:a,p2:id},"Getauscht");return;}
  if(d.pair){const [a,b]=d.pair.split(",").map(Number);live={a,b,ga:0,gb:0};render();return;}
  if(d.goal){live[d.goal]++;render();return;}
  if(d.undo){live[d.undo]=Math.max(0,live[d.undo]-1);render();return;}
  if(d.delgame){await act("admin_delete_game",{p_game:+d.delgame},"Spiel gelöscht, Bewertungen neu berechnet");return;}
  if(d.copy){copy(d.copy);return;}
  if(d.approve){const v=parseFloat($("#st"+d.approve).value);await act("admin_update_player",{p_player:+d.approve,p_data:{status:"aktiv",rating:isNaN(v)?6.5:v}},"Freigegeben");return;}
  if(d.reject){await act("admin_reject_player",{p_player:+d.reject},"Abgelehnt");return;}
  if(d.link){try{const res=await rpc("admin_create_link",{p_token:token,p_player:+d.link});sendLink(+d.link,res);}catch(err){handleErr(err);}return;}
  if(d.delrule){await act("admin_delete_rule",{p_rule:+d.delrule},"Spieltag entfernt");return;}
  switch(d.act){
    case "register":{const n=$("#regname").value.trim();try{const res=await rpc("register",{p_code:regCode,p_name:n});setToken(res.token);history.replaceState(null,"",BASE);regCode=null;await load();}catch(err){handleErr(err);}return;}
    case "gen":await act("admin_generate_teams",{},"Teams Rot, Grün, Blau ausgeglichen verteilt");return;
    case "markShared":await act("admin_mark_shared",{},"Als geteilt markiert");return;
    case "copyShare":copy(shareText());return;
    case "startPoll":await act("admin_start_poll",{},"Abstimmung gestartet");return;
    case "saveLive":{const l=live;const st=await act("admin_add_game",{p_a:l.a,p_b:l.b,p_ga:l.ga,p_gb:l.gb});if(st){live=null;render();toast(`Gespeichert: ${tname(l.a)} ${l.ga} : ${l.gb} ${tname(l.b)}`);}return;}
    case "cancelLive":live=null;render();return;
    case "close":if(!confirmClose){confirmClose=true;render();return;}confirmClose=false;await act("admin_close_matchday",{},"Spieltag abgeschlossen");tab="historie";render();return;
    case "addPlayer":{const n=$("#nn").value.trim(),v=parseFloat($("#ns").value);try{const res=await rpc("admin_add_player",{p_token:token,p_name:n,p_rating:isNaN(v)?6.5:v});S=await rpc("get_state",{p_token:token});sendLink(res.player_id,res);}catch(err){handleErr(err);}return;}
    case "newInvite":await act("admin_new_invite",{},"Neuer Registrierungslink erzeugt, der alte gilt nicht mehr");return;
    case "saveTpl":await act("admin_save_template",{p_template:$("#tpl").value},"Vorlage gespeichert");return;
    case "addRule":await act("admin_save_rule",{p_rule:{active:true,game_dow:1,game_time:"19:00",poll_dow:5,poll_time:"12:00",split_dow:1,split_time:"12:00"}},"Spieltag hinzugefügt");return;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pick]")){e.preventDefault();e.target.click();}});
document.addEventListener("input",e=>{if(e.target.id==="tpl"){S.settings.template=e.target.value;const pv=$("#tplprev");if(pv)pv.textContent=shareText();}});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.cat){const v=parseFloat(el.value);if(isNaN(v))return;await act("admin_update_player",{p_player:+el.dataset.pid,p_data:{[el.dataset.cat]:v}},"Bewertung gespeichert");return;}
  if(el.dataset.phone){await act("admin_update_player",{p_player:+el.dataset.phone,p_data:{phone:el.value.trim()}},"Handynummer gespeichert");return;}
  if(el.dataset.rule){const r={...S.rules.find(x=>x.id===+el.dataset.rule)};const f=el.dataset.field;r[f]=f==="active"?el.checked:(f.endsWith("dow")?+el.value:el.value);await act("admin_save_rule",{p_rule:r},"Einstellung gespeichert");return;}
});

// ---------- Start ----------
(async function boot(){
  const q=new URLSearchParams(location.search);
  const z=q.get("z"),rc=q.get("r");
  if(z){try{const res=await rpc("redeem_link",{p_link:z});setToken(res.token);toast("Angemeldet");}catch(err){if(!token){$("#main").innerHTML=`<div class="card wide"><h2>Link ungültig</h2><p class="muted">${ERR.LINK_UNGUELTIG}</p></div>`;history.replaceState(null,"",BASE);return;}}history.replaceState(null,"",BASE);}
  if(rc&&!token){regCode=rc;renderRegister();return;}
  if(!token){renderNoLogin();return;}
  await load();
  setInterval(()=>{const busyInput=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(document.visibilityState==="visible"&&!live&&!busyInput&&tab!=="admin")load(true);},20000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!live)load(true);});
})();
</script>
